# auth-proxy — dış dünyaya (cloudflared tüneli) açılan TEK kapı.
#   :8080 → web-ui:8080     :8000 → gateway:8000
# Her istek önce auth-svc'ye sorulur (auth_request); geçerli oturum çerezi yoksa istek arka servise HİÇ gitmez:
# tarayıcı /auth/login'e yönlenir, API istemcisi 401 JSON alır.

# cloudflared https'i sonlandırır ve X-Forwarded-Proto: https gönderir → çerez Secure işaretlenir
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Tünel arkasında $remote_addr hep yerel cloudflared'dir; gerçek istemci IP'si Cf-Connecting-Ip'dedir
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Kaba kuvvet freni: istemci IP'si başına dakikada 10 giriş denemesi (+10 ani)
limit_req_zone $client_ip zone=auth_login:1m rate=10r/m;
limit_req_status 429;

# Docker iç DNS'i: arka servis container'ı yeniden oluşturulup yeni IP alınca nginx adresi çalışırken yeniden çözer
# (yoksa açılışta çözülen eski IP'ye gidip 502 verir ve auth-proxy'nin de yeniden başlatılması gerekir). `resolve` nginx >= 1.27.3.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream auth_svc   { zone up_auth 64k;    server auth-svc:8090 resolve; keepalive 16; }
upstream web_ui     { zone up_web 64k;     server web-ui:8080   resolve; keepalive 16; }
upstream gateway_up { zone up_gateway 64k; server gateway:8000  resolve; keepalive 16; }

server {
    listen 8080;
    server_name _;
    include /etc/nginx/snippets/auth-gate.inc;

    location / {
        auth_request /_auth;
        proxy_pass http://web_ui;
        include /etc/nginx/snippets/proxy-headers.inc;
    }
}

server {
    listen 8000;
    server_name _;
    include /etc/nginx/snippets/auth-gate.inc;

    location / {
        auth_request /_auth;
        proxy_pass http://gateway_up;
        include /etc/nginx/snippets/proxy-headers.inc;
    }
}
