# Üs Koruma Sistemi — yerel/demo orkestrasyonu.
#   cp .env.example .env   # GLM_API_KEY, GATEWAY_API_KEYS, POSTGRES_PASSWORD'u düzenleyin
#   docker compose up --build
# NOT: Bu dosya YAZILDI; bu depoda `docker compose up` ÇALIŞTIRILMADI.
# Dışarı YALNIZCA auth-proxy açılır: host :8080 → web-ui, host :8000 → gateway; ikisi de giriş sayfası (auth-svc) arkasında.
# web-ui ve gateway'in kendi portları artık host'a yayınlanmaz. Tünel: cloudflared tunnel --url http://localhost:8080 (ve :8000)
name: uskoruma

x-python-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Olay akışında üs zones.json'dan gelir; BASE_* yalnızca eski/demo akışı ve varsayılan yarıçap içindir.
  BASE_LAT: ${BASE_LAT:-39.9000}
  BASE_LON: ${BASE_LON:-32.7500}
  BASE_RADIUS_M: ${BASE_RADIUS_M:-1500}
  # Olay veri seti (image_meta.json, tracks.csv, zones.json, field_reports.json, images/, ground_truth.json).
  # Host'taki ./data klasörü /data olarak salt-okunur bağlanır; gerçek veri için DATA_DIR=/data verin.
  DATA_DIR: ${DATA_DIR:-/data/synthetic}
  DATASET_DATE: ${DATASET_DATE:-2025-06-01}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: uskoruma
      POSTGRES_USER: uskoruma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uskoruma -d uskoruma"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mock-data-svc:
    build:
      context: ./mock-data-svc
      dockerfile: ../docker/mock-data-svc.Dockerfile
    environment:
      <<: *common-env
    volumes:
      - ./data:/data:ro
    restart: unless-stopped

  detection-svc:
    build:
      context: ./detection-svc
      dockerfile: ../docker/detection-svc.Dockerfile
      args:
        WITH_MODEL: ${DETECTION_WITH_MODEL:-false}
    environment:
      <<: *common-env
      MOCK_MODE: ${MOCK_MODE:-true}            # false: gerçek model (yüklenemezse servis AÇILMAZ; MOCK_FALLBACK=true ile mock'a düşer ve /health "degraded" olur)
      MOCK_FALLBACK: ${MOCK_FALLBACK:-false}
      MODEL_BACKEND: ${MODEL_BACKEND:-ultralytics}   # ultralytics | dfine
      MODEL_PATH: ${MODEL_PATH:-/srv/models/stage1.pt}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.4}   # 0.25: daha yüksek recall, daha çok izsiz gürültü kutusu
    volumes:
      - ./detection-svc/models:/srv/models:ro   # ağırlık: detection-svc/models/stage1.pt (YOLO) veya dfine.pt (D-FINE)
      - ./data:/data:ro
    restart: unless-stopped

  core-svc:
    build:
      context: ./core-svc
      dockerfile: ../docker/core-svc.Dockerfile
    environment:
      <<: *common-env
      DEMO_MODE: ${DEMO_MODE:-false}   # true: eski drone/kafile demo akışı (duvar saatine çapalı sentetik izler)
      DATABASE_URL: postgresql://uskoruma:${POSTGRES_PASSWORD:-change-me}@db:5432/uskoruma
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  pattern-svc:
    build:
      context: ./pattern-svc
      dockerfile: ../docker/pattern-svc.Dockerfile
    environment:
      <<: *common-env
      CORE_SVC_URL: http://core-svc:8002
    depends_on:
      - core-svc
    restart: unless-stopped

  risk-agent-svc:
    build:
      context: ./risk-agent-svc
      dockerfile: ../docker/risk-agent-svc.Dockerfile
    environment:
      <<: *common-env
      # LLM sağlayıcı: LLM_PROVIDER=openrouter (BİRİNCİL, varsayılan) | glm (ikincil, organizatör gateway'i). Anahtar yoksa kural tabanlı (LLM'siz) mod.
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_BASE_URL: ${LLM_BASE_URL:-}          # boş: sağlayıcı varsayılanı; dolu: sağlayıcıdan bağımsız geçersiz kılma
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}   # boş: nvidia/nemotron-3-ultra-550b-a55b:free
      LLM_MAX_REQUESTS_PER_DAY: ${LLM_MAX_REQUESTS_PER_DAY:-}   # boş: openrouter=40 (ücretsiz katman 50/gün), glm=sınırsız
      LLM_SEND_REASONING_EFFORT: ${LLM_SEND_REASONING_EFFORT:-}  # boş: yalnızca glm'de gönderilir
      AGENT_MAX_ROUNDS: ${AGENT_MAX_ROUNDS:-12}              # modeller araçları tek tek çağırırsa 8 tur yetmiyordu
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://berriailitellm-databasev1826rc3-production-d691.up.railway.app/v1}   # /v1 ile biter (sohbet)
      GLM_ROOT_URL: ${GLM_ROOT_URL:-}          # key/info için kök URL (/v1'siz); boşsa GLM_BASE_URL'den türetilir
      GLM_MODEL: ${GLM_MODEL:-glm-5.3-flash}
      GLM_REASONING_EFFORT: ${GLM_REASONING_EFFORT:-low}   # low|high|max — 'thinking' parametresi gönderilmez
      GLM_MAX_TOKENS: ${GLM_MAX_TOKENS:-4000}
      BUDGET_TOTAL_USD: ${BUDGET_TOTAL_USD:-15}
      BUDGET_RESERVE_USD: ${BUDGET_RESERVE_USD:-1}
      BUDGET_REQUESTS_PER_MINUTE: ${BUDGET_REQUESTS_PER_MINUTE:-}   # boş: glm=50, openrouter=15
      BUDGET_TOKENS_PER_MINUTE: ${BUDGET_TOKENS_PER_MINUTE:-400000}
      BUDGET_TOKENS_PER_ASSESSMENT: ${BUDGET_TOKENS_PER_ASSESSMENT:-60000}
      ON_BUDGET_EXCEEDED: ${ON_BUDGET_EXCEEDED:-fallback}
      CORE_SVC_URL: http://core-svc:8002
      PATTERN_SVC_URL: http://pattern-svc:8003
      MOCK_DATA_SVC_URL: http://mock-data-svc:8004
      DATABASE_URL: postgresql://uskoruma:${POSTGRES_PASSWORD:-change-me}@db:5432/uskoruma
    depends_on:
      - core-svc
      - pattern-svc
      - mock-data-svc
      - db
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: ../docker/gateway.Dockerfile
    environment:
      <<: *common-env
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-dev-key-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DETECTION_SVC_URL: http://detection-svc:8001
      CORE_SVC_URL: http://core-svc:8002
      PATTERN_SVC_URL: http://pattern-svc:8003
      MOCK_DATA_SVC_URL: http://mock-data-svc:8004
      RISK_AGENT_SVC_URL: http://risk-agent-svc:8005
    expose:
      - "8000"   # host'a YAYINLANMAZ: dış erişim auth-proxy :8000 üzerinden
    depends_on:
      - detection-svc
      - core-svc
      - pattern-svc
      - mock-data-svc
      - risk-agent-svc
    restart: unless-stopped

  web-ui:
    build:
      context: ./web-ui
      dockerfile: ../docker/web-ui.Dockerfile
    environment:
      GATEWAY_URL: http://gateway:8000
      # UI anahtar SORMAZ: nginx bu anahtarı /api isteklerine sunucu tarafında ekler (varsayılan: gateway'in anahtarı). Boş bırakırsanız UI anahtar sorar.
      UI_GATEWAY_API_KEY: ${UI_GATEWAY_API_KEY-${GATEWAY_API_KEYS:-dev-key-change-me}}
    expose:
      - "8080"   # host'a YAYINLANMAZ: dış erişim auth-proxy :8080 üzerinden
    depends_on:
      - gateway
    restart: unless-stopped

  # Oturum kapısı: giriş sayfası + imzalı çerez doğrulama (auth-proxy'nin auth_request hedefi; yalnızca iç ağ)
  auth-svc:
    build:
      context: ./auth-svc
      dockerfile: ../docker/auth-svc.Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Kimlik bilgilerinin VARSAYILANI YOK: .env'de yoksa compose hata verir (repoda bilinen bir şifreyle açık kalmasın)
      AUTH_USERNAME: ${AUTH_USERNAME:?AUTH_USERNAME .env içinde tanımlanmalı}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD .env içinde tanımlanmalı (en az 12 karakter)}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET .env içinde tanımlanmalı (openssl rand -hex 32)}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
    restart: unless-stopped

  # Dışarı açılan TEK servis (cloudflared tünelinin hedefi). Doğrulanmamış hiçbir istek web-ui/gateway'e iletilmez.
  auth-proxy:
    build:
      context: ./auth-proxy
      dockerfile: ../docker/auth-proxy.Dockerfile
    ports:
      - "8080:8080"   # → web-ui
      - "8000:8000"   # → gateway
    depends_on:
      - auth-svc
      - web-ui
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
