# detection-svc: Görüntü önbelleği bellek-içi olduğu için tek replika (GET /images/{id} aynı pod'a düşmeli).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-svc
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: detection-svc
    app.kubernetes.io/part-of: uskoruma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detection-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detection-svc
        app.kubernetes.io/part-of: uskoruma
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: detection-svc
          image: uskoruma/detection-svc:latest   # yerel k3s: imajı `k3s ctr images import` ile yükleyin (README)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: uskoruma-config
          env:
            - name: MOCK_MODE
              valueFrom: {configMapKeyRef: {name: uskoruma-config, key: MOCK_MODE}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data            # olay veri seti (image_meta.json, tracks.csv, zones.json, ...); README: PVC'ye kopyalama
              mountPath: /data
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: uskoruma-data
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: detection-svc
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: detection-svc
    app.kubernetes.io/part-of: uskoruma
spec:
  type: ClusterIP   # yalnızca iç ağ; dış erişim yalnızca web-ui/gateway Ingress'i üzerinden
  selector:
    app.kubernetes.io/name: detection-svc
  ports:
    - name: http
      port: 8001
      targetPort: http
