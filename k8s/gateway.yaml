# gateway: Pipeline koşuları ve log paneli bellek-içi olduğu için tek replika.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: uskoruma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: uskoruma
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: uskoruma/gateway:latest   # yerel k3s: imajı `k3s ctr images import` ile yükleyin (README)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: uskoruma-config
          env:
            - name: GATEWAY_API_KEYS
              valueFrom: {secretKeyRef: {name: uskoruma-secrets, key: GATEWAY_API_KEYS}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "500m", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: uskoruma
spec:
  type: ClusterIP   # yalnızca iç ağ; dış erişim yalnızca web-ui/gateway Ingress'i üzerinden
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
