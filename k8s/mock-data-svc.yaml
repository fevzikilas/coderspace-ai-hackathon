# mock-data-svc: Statik/dummy veri.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-data-svc
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: mock-data-svc
    app.kubernetes.io/part-of: uskoruma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-data-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-data-svc
        app.kubernetes.io/part-of: uskoruma
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-data-svc
          image: uskoruma/mock-data-svc:latest   # yerel k3s: imajı `k3s ctr images import` ile yükleyin (README)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: uskoruma-config
          env: []
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: "250m", memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data            # olay veri seti (image_meta.json, tracks.csv, zones.json, ...); README: PVC'ye kopyalama
              mountPath: /data
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: uskoruma-data
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: mock-data-svc
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: mock-data-svc
    app.kubernetes.io/part-of: uskoruma
spec:
  type: ClusterIP   # yalnızca iç ağ; dış erişim yalnızca web-ui/gateway Ingress'i üzerinden
  selector:
    app.kubernetes.io/name: mock-data-svc
  ports:
    - name: http
      port: 8004
      targetPort: http
