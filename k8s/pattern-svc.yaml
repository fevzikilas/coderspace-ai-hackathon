# pattern-svc: Durumsuz; yatay ölçeklenebilir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pattern-svc
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: pattern-svc
    app.kubernetes.io/part-of: uskoruma
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pattern-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pattern-svc
        app.kubernetes.io/part-of: uskoruma
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pattern-svc
          image: uskoruma/pattern-svc:latest   # yerel k3s: imajı `k3s ctr images import` ile yükleyin (README)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          envFrom:
            - configMapRef:
                name: uskoruma-config
          env: []
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: "500m", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pattern-svc
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: pattern-svc
    app.kubernetes.io/part-of: uskoruma
spec:
  type: ClusterIP   # yalnızca iç ağ; dış erişim yalnızca web-ui/gateway Ingress'i üzerinden
  selector:
    app.kubernetes.io/name: pattern-svc
  ports:
    - name: http
      port: 8003
      targetPort: http
