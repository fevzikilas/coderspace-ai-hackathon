# ÖRNEK — gerçek değerlerle doldurup ayrıca uygulayın; kustomization.yaml'a dahil değildir
# ve depoya gerçek gizli değer COMMIT EDİLMEMELİDİR. Alternatif (README):
#   kubectl -n uskoruma create secret generic uskoruma-secrets \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=DATABASE_URL=... \
#     --from-literal=GLM_API_KEY=... --from-literal=GATEWAY_API_KEYS=...
apiVersion: v1
kind: Secret
metadata:
  name: uskoruma-secrets
  namespace: uskoruma
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  # DATABASE_URL içindeki parola POSTGRES_PASSWORD ile aynı olmalı
  DATABASE_URL: "postgresql://uskoruma:change-me@db:5432/uskoruma"
  GLM_API_KEY: ""                       # boşsa risk-agent kural tabanlı modda çalışır
  GATEWAY_API_KEYS: "change-me-key"     # virgülle ayrılmış birden çok anahtar olabilir
