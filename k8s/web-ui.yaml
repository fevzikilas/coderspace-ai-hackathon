# web-ui: statik UI (nginx-unprivileged). /api isteklerini GATEWAY_URL'e proxy'ler.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/part-of: uskoruma
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-ui
        app.kubernetes.io/part-of: uskoruma
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-ui
          image: uskoruma/web-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATEWAY_URL
              valueFrom: {configMapKeyRef: {name: uskoruma-config, key: GATEWAY_URL}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: uskoruma
  labels:
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/part-of: uskoruma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-ui
  ports:
    - name: http
      port: 80
      targetPort: http
